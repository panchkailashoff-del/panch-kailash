<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panch Kailash | A Journey Across Five Sacred Peaks</title>
    <meta
      name="description"
      content="Panch Kailash — an editorial guide to the five sacred Kailash peaks of the Himalayas: routes, permits, safety, current status and journey planning."
    />
    <meta name="theme-color" content="#0c0c0d" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!--
      GitHub Pages SPA deep-link fix.
      GitHub Pages has no server-side rewrite, so a direct load of
      /panch-kailash/kailash/mount-kailash returns a 404 page.
      public/404.html redirects that request back here, encoding the
      original path in a query string; this script decodes it and
      restores the correct URL before React Router mounts.
      (Standard "spa-github-pages" redirect trick.)
    -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
